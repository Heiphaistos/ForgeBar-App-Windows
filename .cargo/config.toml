# CRT statique : l'ex�cutable n'a besoin d'aucun redistribuable Visual C++.
# Control Flow Guard (cibles MSVC uniquement).
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static", "-C", "control-flow-guard"]

[target.i686-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static", "-C", "control-flow-guard"]

# Compilation crois�e depuis Linux (facultatif) : MinGW-w64.
[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
rustflags = ["-C", "target-feature=+crt-static"]

[target.i686-pc-windows-gnu]
linker = "i686-w64-mingw32-gcc"
rustflags = ["-C", "target-feature=+crt-static"]

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, i686-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup target add ${{ matrix.target }} && rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --target ${{ matrix.target }} -- -D warnings
      - name: Tests
        run: cargo test --workspace --target ${{ matrix.target }}
      - name: Build release
        run: cargo build --release --workspace --target ${{ matrix.target }}
      - name: Visual check of every theme
        run: |
          target/${{ matrix.target }}/release/forge-bar.exe --snapshot-all dist/themes
          if ($LASTEXITCODE -ne 0) { Get-Content dist/themes/report.txt; exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: theme-previews-${{ matrix.target }}
          path: dist/themes
      - uses: actions/upload-artifact@v4
        with:
          name: forge-bar-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/forge-bar.exe
            target/${{ matrix.target }}/release/forge-settings.exe

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: i686-pc-windows-msvc
            arch: x86
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --target ${{ matrix.target }}
      - run: cargo build --release --workspace --target ${{ matrix.target }}
      - name: Visual check of every theme
        run: |
          # forge-bar.exe is a GUI-subsystem app: PowerShell does not wait for it or set $LASTEXITCODE
          $p = Start-Process -FilePath target/${{ matrix.target }}/release/forge-bar.exe -ArgumentList '--snapshot-all','dist/themes-${{ matrix.arch }}' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { Get-Content dist/themes-${{ matrix.arch }}/report.txt; exit 1 }
      - name: Package zip
        shell: pwsh
        run: |
          $out = "dist/ForgeBar-${{ github.ref_name }}-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item target/${{ matrix.target }}/release/forge-bar.exe, target/${{ matrix.target }}/release/forge-settings.exe $out
          Copy-Item README.md, LICENSE $out
          Copy-Item themes $out/themes -Recurse
          Compress-Archive -Path "$out/*" -DestinationPath "$out.zip"
      - name: Package MSI
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          $v = "${{ github.ref_name }}".TrimStart("v")
          wix build -arch ${{ matrix.arch }} -d Version=$v -d "BinDir=$PWD/target/${{ matrix.target }}/release" -d "RepoDir=$PWD" installer/forge-bar.wxs -o "dist/ForgeBar-$v-${{ matrix.arch }}.msi"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.msi

  publish:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and winget manifest
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          $sha = @{}
          foreach ($a in "x64", "x86") { $sha[$a] = (Get-FileHash "dist/ForgeBar-$v-$a.msi" -Algorithm SHA256).Hash }
          Get-ChildItem dist -File | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content dist/SHA256SUMS.txt
          ./scripts/make-winget.ps1 -Version $v -ShaX64 $sha["x64"] -ShaX86 $sha["x86"] -Out winget
          Compress-Archive -Path winget/* -DestinationPath dist/ForgeBar-winget-manifest.zip
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/*.zip dist/*.msi dist/SHA256SUMS.txt --repo "${{ github.repository }}" --generate-notes

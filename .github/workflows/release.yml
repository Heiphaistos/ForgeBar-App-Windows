name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: i686-pc-windows-msvc
            arch: x86
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --workspace --target ${{ matrix.target }}
      - run: cargo build --release --workspace --target ${{ matrix.target }}
      - name: Visual check of every theme
        run: |
          # forge-bar.exe is a GUI-subsystem app: PowerShell does not wait for it or set $LASTEXITCODE
          $p = Start-Process -FilePath target/${{ matrix.target }}/release/forge-bar.exe -ArgumentList '--snapshot-all','dist/themes-${{ matrix.arch }}' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { Get-Content dist/themes-${{ matrix.arch }}/report.txt; exit 1 }
      - name: Package zip
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $out = "dist/ForgeBar-$env:TAG-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item target/${{ matrix.target }}/release/forge-bar.exe, target/${{ matrix.target }}/release/forge-settings.exe $out
          Copy-Item README.md, LICENSE $out
          Copy-Item themes $out/themes -Recurse
          Compress-Archive -Path "$out/*" -DestinationPath "$out.zip"
      - name: Package MSI
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          dotnet tool install --global wix --version 5.0.2
          $v = $env:TAG.TrimStart("v")
          wix build -arch ${{ matrix.arch }} -d Version=$v -d "BinDir=$PWD/target/${{ matrix.target }}/release" -d "RepoDir=$PWD" installer/forge-bar.wxs -o "dist/ForgeBar-$v-${{ matrix.arch }}.msi"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.msi

  publish:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and winget manifest
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $v = $env:TAG.TrimStart("v")
          $sha = @{}
          foreach ($a in "x64", "x86") { $sha[$a] = (Get-FileHash "dist/ForgeBar-$v-$a.msi" -Algorithm SHA256).Hash }
          Get-ChildItem dist -File | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content dist/SHA256SUMS.txt
          ./scripts/make-winget.ps1 -Version $v -ShaX64 $sha["x64"] -ShaX86 $sha["x86"] -Out winget
          Compress-Archive -Path winget/* -DestinationPath dist/ForgeBar-winget-manifest.zip
      - name: Sign checksums (Ed25519)
        shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then echo "secret UPDATE_SIGNING_KEY manquant : les mises a jour seraient refusees"; exit 1; fi
          pip install cryptography==43.0.3
          python scripts/sign-sums.py dist/SHA256SUMS.txt dist/SHA256SUMS.txt.sig
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release create "$TAG" dist/*.zip dist/*.msi dist/SHA256SUMS.txt dist/SHA256SUMS.txt.sig --repo "$REPO" --generate-notes

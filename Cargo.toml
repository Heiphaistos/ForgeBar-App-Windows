[workspace]
resolver = "2"
members = ["crates/forge-bar", "crates/forge-config", "crates/forge-claude", "crates/forge-settings"]

[workspace.package]
version = "0.6.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/Heiphaistos/ForgeBar-App-Windows"

[workspace.dependencies]
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
toml = "0.8.19"
chrono = { version = "0.4.38", default-features = false, features = ["clock", "std"] }
windows = { version = "0.58.0", features = ["implement"] }
windows-core = "0.58.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

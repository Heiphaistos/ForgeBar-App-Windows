[package]
name = "forge-settings"
description = "Paramètres de Forge Bar (processus séparé, lancé à la demande)"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
embed-resource = "3"

[dependencies]
forge-config = { path = "../forge-config" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Security_Credentials", "Win32_System_Console"]

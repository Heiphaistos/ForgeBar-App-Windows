<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<link rel="icon" type="image/png" href="<!--FAVICON-->">
<title>Forge Bar - Paramètres</title>
<style nonce="{{NONCE}}"><!--CSS--></style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <img class="logo" alt="" width="44" height="44" src="<!--LOGO-->">
      <div class="brand-text"><strong>Forge Bar</strong><small>Paramètres</small></div>
    </div>
    <nav id="tabs" role="tablist" aria-label="Sections"></nav>
    <div class="side-foot">
      <button id="quit" class="ghost" title="Arrête le serveur local">Fermer l'éditeur</button>
    </div>
  </aside>
  <div class="content">
    <header class="top">
      <div class="titles"><h1 id="page-title">Paramètres</h1><p id="page-sub"></p></div>
      <div class="tools">
        <label class="inline">Écran <select id="screen-sel" aria-label="Écran édité"></select></label>
        <label class="check mini"><input id="live" type="checkbox" checked><span>Aperçu en direct</span></label>
        <button id="revert" class="ghost" title="Annule tout ce qui a été changé depuis l'ouverture">Rétablir</button>
        <span id="msg" role="status" aria-live="polite"></span>
        <button id="save" class="primary" disabled>Enregistrer</button>
      </div>
    </header>
    <section class="barprev" id="barprev" aria-label="Aperçu de la barre">
      <div class="barprev-head"><span>Votre barre</span><small id="barprev-note"></small></div>
      <div class="barprev-img" id="barprev-img"></div>
    </section>
    <main id="main"><p>Chargement…</p></main>
  </div>
</div>
<script nonce="{{NONCE}}"><!--JS--></script>
</body>
</html>

# Thème intégré Forge Bar — copiez ce fichier dans %APPDATA%\ForgeBar\themes pour le modifier,
# ou créez un fichier avec `extends = "ambre-verre"` pour n'en changer que quelques valeurs.
name = "Ambre de verre"
family = "Moderne"
backdrop = "acrylic"
radius = 14.0
border_width = 1.0
font_family = "Segoe UI Variable Text"
mono_family = "Cascadia Mono"
font_size = 12.0
spacing = 14.0

[background]
kind = "solid"
colors = ["#1C1208"]
angle = 0.0
opacity = 0.55

[colors]
text = "#FFEBD0"
text_secondary = "#FFEBD0B3"
accent = "#FFB020"
border = "#FFD79A30"

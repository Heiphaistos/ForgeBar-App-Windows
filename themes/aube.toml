# Thème intégré Forge Bar — copiez ce fichier dans %APPDATA%\ForgeBar\themes pour le modifier,
# ou créez un fichier avec `extends = "aube"` pour n'en changer que quelques valeurs.
name = "Aube"
family = "Moderne"
backdrop = "acrylic"
radius = 14.0
border_width = 1.0
font_family = "Segoe UI Variable Text"
mono_family = "Cascadia Mono"
font_size = 12.0
spacing = 14.0

[background]
kind = "solid"
colors = ["#FFF4E6"]
angle = 0.0
opacity = 0.6

[colors]
text = "#2B1B0E"
text_secondary = "#2B1B0ECC"
accent = "#C2410C"
border = "#FFFFFF66"

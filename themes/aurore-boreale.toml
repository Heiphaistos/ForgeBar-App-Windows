# Thème intégré Forge Bar — copiez ce fichier dans %APPDATA%\ForgeBar\themes pour le modifier,
# ou créez un fichier avec `extends = "aurore-boreale"` pour n'en changer que quelques valeurs.
name = "Aurore boréale"
family = "Moderne"
backdrop = "acrylic"
radius = 14.0
border_width = 1.0
font_family = "Segoe UI Variable Text"
mono_family = "Cascadia Mono"
font_size = 12.0
spacing = 14.0

[background]
kind = "linear"
colors = ["#0B3B3A", "#2A1A4F"]
angle = 0.0
opacity = 0.55

[colors]
text = "#EAFBF7"
text_secondary = "#EAFBF7B8"
accent = "#5EEAD4"
border = "#FFFFFF2A"

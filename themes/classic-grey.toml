# Thème intégré Forge Bar — copiez ce fichier dans %APPDATA%\ForgeBar\themes pour le modifier,
# ou créez un fichier avec `extends = "classic-grey"` pour n'en changer que quelques valeurs.
name = "Gris classique"
family = "Rétro"
backdrop = "none"
radius = 0.0
border_width = 1.0
font_family = "Tahoma"
mono_family = "Cascadia Mono"
font_size = 12.0
spacing = 14.0

[background]
kind = "solid"
colors = ["#C0C0C0"]
angle = 0.0
opacity = 1.00

[colors]
text = "#000000"
text_secondary = "#404040"
accent = "#000080"
border = "#FFFFFF"

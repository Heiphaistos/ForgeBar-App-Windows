# Thème intégré Forge Bar — copiez ce fichier dans %APPDATA%\ForgeBar\themes pour le modifier,
# ou créez un fichier avec `extends = "cyberpunk"` pour n'en changer que quelques valeurs.
name = "Cyberpunk"
family = "neon"
backdrop = "none"
radius = 0.0
border_width = 1.0
font_family = "Cascadia Mono"
mono_family = "Cascadia Mono"
font_size = 11.5
spacing = 14.0

[background]
kind = "linear"
colors = ["#0D0221", "#2A0944"]
angle = 0.0
opacity = 1.00

[colors]
text = "#F5F5F5"
text_secondary = "#A8A8B8"
accent = "#FF2A6D"
border = "#05D9E8"

# Thème intégré Forge Bar — copiez ce fichier dans %APPDATA%\ForgeBar\themes pour le modifier,
# ou créez un fichier avec `extends = "ember"` pour n'en changer que quelques valeurs.
name = "Braise"
family = "gradient"
backdrop = "none"
radius = 0.0
border_width = 0.0
font_family = "Segoe UI Variable Text"
mono_family = "Cascadia Mono"
font_size = 12.0
spacing = 14.0

[background]
kind = "linear"
colors = ["#3A0D06", "#B22A0E", "#F0761D"]
angle = 0.0
opacity = 1.00

[colors]
text = "#FFFFFF"
text_secondary = "#F0F0F0"
accent = "#FFD27F"
border = ""

# Thème intégré Forge Bar — copiez ce fichier dans %APPDATA%\ForgeBar\themes pour le modifier,
# ou créez un fichier avec `extends = "forest"` pour n'en changer que quelques valeurs.
name = "Forêt"
family = "Dégradés"
backdrop = "none"
radius = 0.0
border_width = 0.0
font_family = "Segoe UI Variable Text"
mono_family = "Cascadia Mono"
font_size = 12.0
spacing = 14.0

[background]
kind = "linear"
colors = ["#134E5E", "#71B280"]
angle = 0.0
opacity = 1.00

[colors]
text = "#FFFFFF"
text_secondary = "#F0F0F0"
accent = "#E8F5C8"
border = ""

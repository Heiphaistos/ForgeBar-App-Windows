# Thème intégré Forge Bar — copiez ce fichier dans %APPDATA%\ForgeBar\themes pour le modifier,
# ou créez un fichier avec `extends = "glass-clear"` pour n'en changer que quelques valeurs.
name = "Verre clair"
family = "Verre"
backdrop = "acrylic"
radius = 12.0
border_width = 1.0
font_family = "Segoe UI Variable Text"
mono_family = "Cascadia Mono"
font_size = 12.0
spacing = 14.0

[background]
kind = "solid"
colors = ["#FFFFFF"]
angle = 0.0
opacity = 0.60

[colors]
text = "#111111"
text_secondary = "#3A3A3A"
accent = "#005FB8"
border = "#FFFFFF33"

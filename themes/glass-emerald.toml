# Thème intégré Forge Bar — copiez ce fichier dans %APPDATA%\ForgeBar\themes pour le modifier,
# ou créez un fichier avec `extends = "glass-emerald"` pour n'en changer que quelques valeurs.
name = "Cristal émeraude"
family = "Verre"
backdrop = "acrylic"
radius = 12.0
border_width = 1.0
font_family = "Segoe UI Variable Text"
mono_family = "Cascadia Mono"
font_size = 12.0
spacing = 14.0

[background]
kind = "solid"
colors = ["#7FE0A8"]
angle = 0.0
opacity = 0.75

[colors]
text = "#04210F"
text_secondary = "#13391F"
accent = "#003D1A"
border = "#FFFFFF33"

# Thème intégré Forge Bar — copiez ce fichier dans %APPDATA%\ForgeBar\themes pour le modifier,
# ou créez un fichier avec `extends = "glass-frost"` pour n'en changer que quelques valeurs.
name = "Givre"
family = "Verre"
backdrop = "acrylic"
radius = 12.0
border_width = 1.0
font_family = "Segoe UI Variable Text"
mono_family = "Cascadia Mono"
font_size = 12.0
spacing = 14.0

[background]
kind = "solid"
colors = ["#DDEEFF"]
angle = 0.0
opacity = 0.60

[colors]
text = "#0B2540"
text_secondary = "#33536F"
accent = "#1C7CD6"
border = "#FFFFFF33"

# Thème intégré Forge Bar — copiez ce fichier dans %APPDATA%\ForgeBar\themes pour le modifier,
# ou créez un fichier avec `extends = "glass-mica"` pour n'en changer que quelques valeurs.
name = "Verre Mica"
family = "Verre"
backdrop = "mica"
radius = 12.0
border_width = 1.0
font_family = "Segoe UI Variable Text"
mono_family = "Cascadia Mono"
font_size = 12.0
spacing = 14.0

[background]
kind = "solid"
colors = ["#202020"]
angle = 0.0
opacity = 0.20

[colors]
text = "#FFFFFF"
text_secondary = "#D0D0D0"
accent = "#4CC2FF"
border = "#FFFFFF33"

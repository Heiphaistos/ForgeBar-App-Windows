# Thème intégré Forge Bar — copiez ce fichier dans %APPDATA%\ForgeBar\themes pour le modifier,
# ou créez un fichier avec `extends = "glass-rose"` pour n'en changer que quelques valeurs.
name = "Cristal rose"
family = "glass"
backdrop = "acrylic"
radius = 12.0
border_width = 1.0
font_family = "Segoe UI Variable Text"
mono_family = "Cascadia Mono"
font_size = 12.0
spacing = 14.0

[background]
kind = "solid"
colors = ["#FF8FB1"]
angle = 0.0
opacity = 0.28

[colors]
text = "#2A0A16"
text_secondary = "#5A2338"
accent = "#B0004A"
border = "#FFFFFF33"

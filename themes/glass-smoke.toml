# Thème intégré Forge Bar — copiez ce fichier dans %APPDATA%\ForgeBar\themes pour le modifier,
# ou créez un fichier avec `extends = "glass-smoke"` pour n'en changer que quelques valeurs.
name = "Verre fumé"
family = "glass"
backdrop = "acrylic"
radius = 12.0
border_width = 1.0
font_family = "Segoe UI Variable Text"
mono_family = "Cascadia Mono"
font_size = 12.0
spacing = 14.0

[background]
kind = "solid"
colors = ["#000000"]
angle = 0.0
opacity = 0.35

[colors]
text = "#FFFFFF"
text_secondary = "#D0D0D0"
accent = "#4CC2FF"
border = "#FFFFFF33"

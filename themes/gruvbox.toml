# Thème intégré Forge Bar — copiez ce fichier dans %APPDATA%\ForgeBar\themes pour le modifier,
# ou créez un fichier avec `extends = "gruvbox"` pour n'en changer que quelques valeurs.
name = "Gruvbox"
family = "dev"
backdrop = "none"
radius = 0.0
border_width = 0.0
font_family = "Cascadia Mono"
mono_family = "Cascadia Mono"
font_size = 11.5
spacing = 14.0

[background]
kind = "solid"
colors = ["#282828"]
angle = 0.0
opacity = 1.00

[colors]
text = "#EBDBB2"
text_secondary = "#BDAE93"
accent = "#FABD2F"
border = ""

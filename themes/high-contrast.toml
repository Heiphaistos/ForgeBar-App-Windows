# Thème intégré Forge Bar — copiez ce fichier dans %APPDATA%\ForgeBar\themes pour le modifier,
# ou créez un fichier avec `extends = "high-contrast"` pour n'en changer que quelques valeurs.
name = "Contraste élevé"
family = "Windows"
backdrop = "none"
radius = 0.0
border_width = 1.0
font_family = "Segoe UI Variable Text"
mono_family = "Cascadia Mono"
font_size = 12.0
spacing = 14.0

[background]
kind = "solid"
colors = ["#000000"]
angle = 0.0
opacity = 1.00

[colors]
text = "#FFFFFF"
text_secondary = "#FFFF00"
accent = "#00FFFF"
border = "#FFFFFF"

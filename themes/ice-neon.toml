# Thème intégré Forge Bar — copiez ce fichier dans %APPDATA%\ForgeBar\themes pour le modifier,
# ou créez un fichier avec `extends = "ice-neon"` pour n'en changer que quelques valeurs.
name = "Néon glacé"
family = "neon"

# Thème intégré Forge Bar — copiez ce fichier dans %APPDATA%\ForgeBar\themes pour le modifier,
# ou créez un fichier avec `extends = "ink"` pour n'en changer que quelques valeurs.
name = "Encre"
family = "minimal"
backdrop = "none"
radius = 0.0
border_width = 0.0
font_family = "Segoe UI Variable Text"
mono_family = "Cascadia Mono"
font_size = 12.0
spacing = 18.0

[background]
kind = "solid"
colors = ["#0A0A0A"]
angle = 0.0
opacity = 1.00

[colors]
text = "#F2F2F2"
text_secondary = "#6E6E6E"
accent = "#C9A227"
border = ""

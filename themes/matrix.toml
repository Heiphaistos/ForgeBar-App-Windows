# Thème intégré Forge Bar — copiez ce fichier dans %APPDATA%\ForgeBar\themes pour le modifier,
# ou créez un fichier avec `extends = "matrix"` pour n'en changer que quelques valeurs.
name = "Matrix"
family = "neon"
backdrop = "none"
radius = 0.0
border_width = 1.0
font_family = "Cascadia Mono"
mono_family = "Cascadia Mono"
font_size = 11.5
spacing = 14.0

[background]
kind = "solid"
colors = ["#000000"]
angle = 0.0
opacity = 1.00

[colors]
text = "#F5F5F5"
text_secondary = "#A8A8B8"
accent = "#00FF41"
border = "#003B00"

# Thème intégré Forge Bar — copiez ce fichier dans %APPDATA%\ForgeBar\themes pour le modifier,
# ou créez un fichier avec `extends = "menthe"` pour n'en changer que quelques valeurs.
name = "Menthe"
family = "Moderne"
backdrop = "acrylic"
radius = 14.0
border_width = 1.0
font_family = "Segoe UI Variable Text"
mono_family = "Cascadia Mono"
font_size = 12.0
spacing = 14.0

[background]
kind = "solid"
colors = ["#E6F7EE"]
angle = 0.0
opacity = 0.6

[colors]
text = "#0E2A1D"
text_secondary = "#0E2A1DCC"
accent = "#0B7A52"
border = "#FFFFFF66"

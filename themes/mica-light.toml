# Thème intégré Forge Bar — copiez ce fichier dans %APPDATA%\ForgeBar\themes pour le modifier,
# ou créez un fichier avec `extends = "mica-light"` pour n'en changer que quelques valeurs.
name = "Mica clair"
family = "windows"
backdrop = "mica"
radius = 0.0
border_width = 0.0
font_family = "Segoe UI Variable Text"
mono_family = "Cascadia Mono"
font_size = 12.0
spacing = 14.0

[background]
kind = "solid"
colors = ["#F3F3F3"]
angle = 0.0
opacity = 0.35

[colors]
text = "#1B1B1B"
text_secondary = "#5C5C5C"
accent = "#005FB8"
border = ""

# Thème intégré Forge Bar — copiez ce fichier dans %APPDATA%\ForgeBar\themes pour le modifier,
# ou créez un fichier avec `extends = "minuit-verre"` pour n'en changer que quelques valeurs.
name = "Minuit de verre"
family = "Moderne"
backdrop = "acrylic"
radius = 14.0
border_width = 1.0
font_family = "Segoe UI Variable Text"
mono_family = "Cascadia Mono"
font_size = 12.0
spacing = 14.0

[background]
kind = "solid"
colors = ["#0A1630"]
angle = 0.0
opacity = 0.55

[colors]
text = "#E6EEFF"
text_secondary = "#E6EEFFB3"
accent = "#5AA9FF"
border = "#9CC4FF30"

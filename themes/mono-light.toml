# Thème intégré Forge Bar — copiez ce fichier dans %APPDATA%\ForgeBar\themes pour le modifier,
# ou créez un fichier avec `extends = "mono-light"` pour n'en changer que quelques valeurs.
name = "Mono clair"
family = "minimal"
backdrop = "none"
radius = 0.0
border_width = 0.0
font_family = "Segoe UI Variable Text"
mono_family = "Cascadia Mono"
font_size = 12.0
spacing = 18.0

[background]
kind = "solid"
colors = ["#FAFAFA"]
angle = 0.0
opacity = 1.00

[colors]
text = "#111111"
text_secondary = "#777777"
accent = "#111111"
border = ""

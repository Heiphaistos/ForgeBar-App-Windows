# Thème intégré Forge Bar — copiez ce fichier dans %APPDATA%\ForgeBar\themes pour le modifier,
# ou créez un fichier avec `extends = "monokai"` pour n'en changer que quelques valeurs.
name = "Monokai"
family = "dev"
backdrop = "none"
radius = 0.0
border_width = 0.0
font_family = "Cascadia Mono"
mono_family = "Cascadia Mono"
font_size = 11.5
spacing = 14.0

[background]
kind = "solid"
colors = ["#272822"]
angle = 0.0
opacity = 1.00

[colors]
text = "#F8F8F2"
text_secondary = "#CFCFC2"
accent = "#A6E22E"
border = ""

# Thème intégré Forge Bar — copiez ce fichier dans %APPDATA%\ForgeBar\themes pour le modifier,
# ou créez un fichier avec `extends = "obsidienne"` pour n'en changer que quelques valeurs.
name = "Obsidienne"
family = "Moderne"
backdrop = "acrylic"
radius = 14.0
border_width = 1.0
font_family = "Segoe UI Variable Text"
mono_family = "Cascadia Mono"
font_size = 12.0
spacing = 14.0

[background]
kind = "solid"
colors = ["#0B0B10"]
angle = 0.0
opacity = 0.55

[colors]
text = "#F2F2F7"
text_secondary = "#F2F2F7B3"
accent = "#B79CFF"
border = "#FFFFFF26"

# Thème intégré Forge Bar — copiez ce fichier dans %APPDATA%\ForgeBar\themes pour le modifier,
# ou créez un fichier avec `extends = "paper"` pour n'en changer que quelques valeurs.
name = "Papier"
family = "retro"
backdrop = "none"
radius = 0.0
border_width = 0.0
font_family = "Georgia"
mono_family = "Cascadia Mono"
font_size = 12.0
spacing = 14.0

[background]
kind = "solid"
colors = ["#F4ECD8"]
angle = 0.0
opacity = 1.00

[colors]
text = "#3B2F2F"
text_secondary = "#6B5B4B"
accent = "#A0522D"
border = ""

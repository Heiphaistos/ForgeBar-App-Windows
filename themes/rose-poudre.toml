# Thème intégré Forge Bar — copiez ce fichier dans %APPDATA%\ForgeBar\themes pour le modifier,
# ou créez un fichier avec `extends = "rose-poudre"` pour n'en changer que quelques valeurs.
name = "Rose poudré"
family = "Moderne"
backdrop = "acrylic"
radius = 14.0
border_width = 1.0
font_family = "Segoe UI Variable Text"
mono_family = "Cascadia Mono"
font_size = 12.0
spacing = 14.0

[background]
kind = "solid"
colors = ["#FDE8F0"]
angle = 0.0
opacity = 0.6

[colors]
text = "#3B1022"
text_secondary = "#3B1022CC"
accent = "#B0134F"
border = "#FFFFFF66"

# Thème intégré Forge Bar — copiez ce fichier dans %APPDATA%\ForgeBar\themes pour le modifier,
# ou créez un fichier avec `extends = "sunset"` pour n'en changer que quelques valeurs.
name = "Crépuscule"
family = "Dégradés"
backdrop = "none"
radius = 0.0
border_width = 0.0
font_family = "Segoe UI Variable Text"
mono_family = "Cascadia Mono"
font_size = 12.0
spacing = 14.0

[background]
kind = "linear"
colors = ["#FF5F6D", "#FFC371"]
angle = 0.0
opacity = 1.00

[colors]
text = "#2B1B17"
text_secondary = "#4A2E26"
accent = "#2B1B17"
border = ""

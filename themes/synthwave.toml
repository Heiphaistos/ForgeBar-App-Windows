# Thème intégré Forge Bar — copiez ce fichier dans %APPDATA%\ForgeBar\themes pour le modifier,
# ou créez un fichier avec `extends = "synthwave"` pour n'en changer que quelques valeurs.
name = "Synthwave"
family = "neon"
backdrop = "none"
radius = 0.0
border_width = 1.0
font_family = "Cascadia Mono"
mono_family = "Cascadia Mono"
font_size = 11.5
spacing = 14.0

[background]
kind = "linear"
colors = ["#241734", "#2E1F47", "#B33F62"]
angle = 0.0
opacity = 1.00

[colors]
text = "#F5F5F5"
text_secondary = "#A8A8B8"
accent = "#F9C80E"
border = "#FF6AD5"

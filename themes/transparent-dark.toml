# Thème intégré Forge Bar — copiez ce fichier dans %APPDATA%\ForgeBar\themes pour le modifier,
# ou créez un fichier avec `extends = "transparent-dark"` pour n'en changer que quelques valeurs.
name = "Transparent (texte clair)"
family = "Minimaliste"
backdrop = "none"
radius = 0.0
border_width = 0.0
font_family = "Segoe UI Variable Text"
mono_family = "Cascadia Mono"
font_size = 12.0
spacing = 18.0

[background]
kind = "solid"
colors = ["#000000"]
angle = 0.0
opacity = 0.00

[colors]
text = "#FFFFFF"
text_secondary = "#DDDDDD"
accent = "#FFFFFF"
border = ""

# Thème intégré Forge Bar — copiez ce fichier dans %APPDATA%\ForgeBar\themes pour le modifier,
# ou créez un fichier avec `extends = "transparent-light"` pour n'en changer que quelques valeurs.
name = "Transparent (texte sombre)"
family = "minimal"
backdrop = "none"
radius = 0.0
border_width = 0.0
font_family = "Segoe UI Variable Text"
mono_family = "Cascadia Mono"
font_size = 12.0
spacing = 18.0

[background]
kind = "solid"
colors = ["#FFFFFF"]
angle = 0.0
opacity = 0.00

[colors]
text = "#000000"
text_secondary = "#333333"
accent = "#000000"
border = ""

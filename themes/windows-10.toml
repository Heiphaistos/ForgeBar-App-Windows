# Thème intégré Forge Bar — copiez ce fichier dans %APPDATA%\ForgeBar\themes pour le modifier,
# ou créez un fichier avec `extends = "windows-10"` pour n'en changer que quelques valeurs.
name = "Windows 10"
family = "windows"
backdrop = "none"
radius = 0.0
border_width = 0.0
font_family = "Segoe UI"
mono_family = "Cascadia Mono"
font_size = 12.0
spacing = 14.0

[background]
kind = "solid"
colors = ["#1F1F1F"]
angle = 0.0
opacity = 1.00

[colors]
text = "#FFFFFF"
text_secondary = "#BFBFBF"
accent = "#0078D7"
border = ""
